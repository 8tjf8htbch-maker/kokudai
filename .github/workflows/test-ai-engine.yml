name: Test local AI engine

on:
  push:
    paths:
      - "ai_engine/**"
      - ".github/workflows/test-ai-engine.yml"
  pull_request:
    paths:
      - "ai_engine/**"
      - ".github/workflows/test-ai-engine.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: ai_engine
        run: python -m unittest -v
