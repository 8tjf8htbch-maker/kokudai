name: Refresh tournament notices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-tournament-notices.yml"
      - "scripts/fetch_tournaments.py"
      - "app.js"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf python-docx openpyxl

      - name: Check deadline parser syntax
        run: python -m py_compile scripts/fetch_tournaments.py

      - name: Fetch official tournament information and primary documents
        run: python scripts/fetch_tournaments.py

      - name: Validate tournament JSON
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          path = Path("data/tournaments.json")
          rows = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(rows, list) and rows, "No tournament records were fetched"
          today = date.today()
          limit = today + timedelta(days=366)
          for row in rows:
              assert row.get("name") and row.get("date"), f"Missing name/date: {row}"
              event_date = date.fromisoformat(row["date"])
              assert today <= event_date <= limit, f"Out-of-range event: {row['name']} ({row['date']})"
              deadline = row.get("officialDeadline")
              if deadline:
                  deadline_date = date.fromisoformat(deadline)
                  assert deadline_date <= event_date, f"Deadline after event: {row['name']} ({deadline})"
              if row.get("deadlineSourceType") == "primary_document":
                  assert row.get("deadlineSourceUrl"), f"Missing source for verified deadline: {row['name']}"
          print(f"Validated {len(rows)} upcoming tournament records")
          print(f"Deadlines requiring confirmation: {sum(not x.get('officialDeadline') for x in rows)}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json
          if git diff --cached --quiet; then
            echo "Tournament data is already up to date."
          else
            git commit -m "Update tournament notices"
            if ! git pull --rebase origin main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/tournaments.json" ]; then
                echo "A newer refresh changed the same data; keeping this run's freshly fetched tournament data."
                git checkout --theirs -- data/tournaments.json
                git add data/tournaments.json
                GIT_EDITOR=true git rebase --continue
              else
                echo "Rebase failed for an unexpected reason."
                exit 1
              fi
            fi
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
